name: Docker Torrent Download

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Torrent file URL'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    container: subekti13/torrent-downloader:latest
    steps:
        - name: Write .env File
          run: |
            echo '${{ secrets.DOTENV }}' >> .env

        - name: Download File
          run: transmission-cli -w /data --exit "${{ github.event.inputs.url }}"

        - name: LS & Check Files
          run: cd /data && ls -la

        - name: Upload to Drive
          run: node /app/upload.js
